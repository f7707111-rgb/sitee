const P={

const COLS=[[0,1,0],[7,2,0],[0,4,0],[0,3,5],[0,6,2],[4,0,0],[5,0,1],[1,7,0],[0,2,3],[0,1,6],[2,0,4]];
function papers(n){let t=SETS[n%SETS.length],c=COLS[n%COLS.length];return `<div class="papers">${['one','two','three'].map((k,j)=>{let p=PAL[c[j]];return `<div class="paper ${k} k-${t[j]}" style="background:linear-gradient(140deg,${p[0]},${p[1]});border-color:${p[2]}">${P[t[j]]()}</div>`}).join('')}</div>`}
function folder(i,n){return `<div class="art" aria-hidden="true"><div class="ground"></div><svg class="back" viewBox="0 0 240 240"><defs><linearGradient id="back${n}" x2=".3" y2="1"><stop stop-color="#e5e8e2"/><stop offset="1" stop-color="#d9dcd6"/></linearGradient></defs><path d="M19 101 Q19 67 49 67 H88 Q103 67 114 77 L127 88 H192 Q220 88 220 117 V194 Q220 220 193 220 H46 Q19 220 19 193Z" fill="url(#back${n})"/></svg>${papers(n)}<svg class="front" viewBox="0 0 240 240"><defs><linearGradient id="front${n}" x1="0" y1="0" x2=".65" y2="1"><stop stop-color="#e9eae6" stop-opacity=".89"/><stop offset=".5" stop-color="#e4e5e1" stop-opacity=".94"/><stop offset="1" stop-color="#d6d9d3" stop-opacity=".96"/></linearGradient><linearGradient id="edge${n}" x2="0" y2="1"><stop stop-color="white" stop-opacity=".7"/><stop offset="1" stop-color="white" stop-opacity=".08"/></linearGradient><filter id="frost${n}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".035"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs><path d="M18 104 Q18 70 49 70 H88 Q100 70 111 78 L122 86 Q126 89 137 89 H190 Q222 89 222 119 V190 Q222 221 191 221 H49 Q18 221 18 190Z" fill="url(#front${n})" stroke="url(#edge${n})" stroke-width="1.2" filter="url(#frost${n})"/></svg><svg class="signature" viewBox="0 0 60 35" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M5 24c14 7 25-15 20-21-8-9-15 30-3 25 6-3 1-15 0-10-5 20 10 12 13 6s2-10 0-8c-5 8-2 17 2 12l6-7-1 7 6-3 4 3M8 29h44M11 13l4 5-6 1 5 4"/></svg><div class="sticker"><img src="${i.icon}" alt=""></div></div><div class="caption">${i.name}<span class="badge">${i.links.length}</span></div><div class="sub">${i.sub}</div>`}
function render(){grid.innerHTML='';let count=0;items.forEach((i,n)=>{if((filter==='all'||i.category===filter)&&`${i.name} ${i.title} ${i.sub}`.toLowerCase().includes(search.value.toLowerCase().trim())){count++;let b=document.createElement('button');b.className='card';b.innerHTML=folder(i,n);b.setAttribute('aria-label',i.title+' — открыть ссылки');b.onclick=()=>openItem(i);grid.append(b)}});document.querySelector('#total').textContent=count+' папок';if(!count)grid.innerHTML='<div class="empty">Ничего не найдено. Попробуйте другое название.</div>'}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(t=>t.setAttribute('aria-pressed',t===b));render()});search.oninput=render;
function view(list){grid.classList.toggle('list',list);document.querySelector('#grid-view').setAttribute('aria-pressed',!list);document.querySelector('#list-view').setAttribute('aria-pressed',list)}document.querySelector('#grid-view').onclick=()=>view(false);document.querySelector('#list-view').onclick=()=>view(true);
function toggleSearch(open){document.querySelector('.searchbar').hidden=!open;document.querySelector('#search-toggle').setAttribute('aria-expanded',open);if(open){document.querySelector('main').scrollTo({top:0,behavior:'smooth'});search.focus()}else{search.value='';render();document.querySelector('#search-toggle').focus()}}document.querySelector('#search-toggle').onclick=()=>toggleSearch(document.querySelector('.searchbar').hidden);document.querySelector('#close-search').onclick=()=>toggleSearch(false);search.onkeydown=e=>{if(e.key==='Escape')toggleSearch(false)};
const dialog=document.querySelector('#details');function openItem(i){document.querySelector('#detail-icon').src=i.icon;document.querySelector('#detail-title').textContent=i.title;document.querySelector('#detail-sub').textContent=[i.sub,i.build].filter(Boolean).join(' / ');let links=document.querySelector('#detail-links');links.innerHTML='';i.links.forEach(l=>{let a=document.createElement('a');a.href=l.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=l.name;let arrow=document.createElement('span');arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');a.append(arrow);links.append(a)});dialog.showModal()}document.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){let r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});(()=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;const c=document.getElementById('puff');document.documentElement.classList.add('puffy');
const sel='button,a,[role=button],.card,.fitem';
addEventListener('pointermove',e=>{c.style.transform=`translate(${e.clientX-6}px,${e.clientY-5}px)`;c.classList.add('on');c.classList.toggle('hot',!!e.target.closest&&!!e.target.closest(sel))},{passive:true});
addEventListener('pointerdown',()=>c.classList.add('down'));addEventListener('pointerup',()=>c.classList.remove('down'));
